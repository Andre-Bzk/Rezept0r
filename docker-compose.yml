services:
  rezeptor:
    build: .
    image: rezeptor:latest
    container_name: rezeptor
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - OPENAI_API_KEY
      - USDA_API_KEY
      - TANDOOR_BASE_URL
      - TANDOOR_API_TOKEN
      - TMP_DIR
      - APP_HOST
      - APP_PORT
      - FFMPEG_LOCATION
      - APP_UID
      - APP_GID
    ports:
      - "88:8000"
    volumes:
      - ${REZEPTOR_TMP_DIR:-./tmp}:/app/tmp
      - ${REZEPTOR_DATA_DIR:-./data}:/app/data
    mem_limit: 512m
    memswap_limit: 512m   # No swap – protect SD card
